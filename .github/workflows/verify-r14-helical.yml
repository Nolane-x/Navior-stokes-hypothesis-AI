name: Verify R14 helical factorization

on:
  push:
    paths:
      - 'research/R14_helical_conflict_bandwidth_Lamb_factorization.md'
      - 'verification/check_R14_helical_factorization.py'
      - '.github/workflows/verify-r14-helical.yml'
  pull_request:
    paths:
      - 'research/R14_helical_conflict_bandwidth_Lamb_factorization.md'
      - 'verification/check_R14_helical_factorization.py'
      - '.github/workflows/verify-r14-helical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helical-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R14 helical factorization algebra
        run: python verification/check_R14_helical_factorization.py
