name: Verify R27 balanced min action

on:
  push:
    paths:
      - 'research/R27_balanced_two_channel_min_action_criterion.md'
      - 'verification/check_R27_balanced_channel_min_action.py'
      - '.github/workflows/verify-r27-balanced-min-action.yml'
  pull_request:
    paths:
      - 'research/R27_balanced_two_channel_min_action_criterion.md'
      - 'verification/check_R27_balanced_channel_min_action.py'
      - '.github/workflows/verify-r27-balanced-min-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R27
        run: python verification/check_R27_balanced_channel_min_action.py
