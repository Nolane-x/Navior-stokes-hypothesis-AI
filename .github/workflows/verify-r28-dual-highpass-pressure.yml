name: Verify R28 dual highpass pressure work

on:
  push:
    paths:
      - 'research/R28_dual_highpass_pressure_work_ultraviolet_escape.md'
      - 'verification/check_R28_dual_highpass_pressure_work_escape.py'
      - '.github/workflows/verify-r28-dual-highpass-pressure.yml'
  pull_request:
    paths:
      - 'research/R28_dual_highpass_pressure_work_ultraviolet_escape.md'
      - 'verification/check_R28_dual_highpass_pressure_work_escape.py'
      - '.github/workflows/verify-r28-dual-highpass-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install --upgrade numpy
      - name: Verify R28
        run: python verification/check_R28_dual_highpass_pressure_work_escape.py
