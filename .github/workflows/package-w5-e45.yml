name: Package W5 E45 public-safe source

on:
  push:
    paths:
      - '.github/workflows/package-w5-e45.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and audit public-safe E45 archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          cat > W5-E45-PACKAGE-MANIFEST.txt <<EOF
          checkpoint=W5-E45
          source_head=${source_head}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          verified_theorem_checker_head=9e7cdc361030dc686be2575f31c02d72a128aa0d
          verified_full_suite_run=32093839544
          r45_specific_run=32093191615
          runtime=Nolane World 0.6.0 / W5
          status=NONCONVERGED_PARTIALS_ONLY
          scope=PUBLIC_SAFE_VERIFIED_PARTIALS_NOT_GLOBAL_REGULARITY
          EOF
          zip -qr Navior-stokes-hypothesis-AI-W5-E45.zip \
            README.md docs research corrections discarded experiments verification checkpoints .github/workflows W5-E45-PACKAGE-MANIFEST.txt \
            -x '*.sqlite3' '*credentials*' '*credential*' '*secret*' '*token*' '*trust*.json' '*/__pycache__/*' '*.pyc' '*.nbc' '*.nbi'
          test -s Navior-stokes-hypothesis-AI-W5-E45.zip
          unzip -t Navior-stokes-hypothesis-AI-W5-E45.zip >/dev/null
          read entries verifiers <<EOF
          $(python - <<'PY'
          import zipfile
          p='Navior-stokes-hypothesis-AI-W5-E45.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
          required=[
              'research/R45_absolute_common_work_tail_and_intrinsic_uv_cap.md',
              'discarded/RD023_gamma_rescaling_does_not_prevent_low_frequency_collapse.md',
              'corrections/C003_R45_exact_work_scale_and_compactness_frontier.md',
              'verification/check_R45_absolute_common_work_tail.py',
              'verification/fresh_verify_e45_common_work_tail_grid.py',
              'verification/check_RD023_gamma_rescaling_low_frequency_collapse.py',
              'verification/R45_gate_result.txt',
              'verification/W5_E45_full_suite_result.txt',
              'verification/W5_E45_world_gate_result.json',
              'checkpoints/W5-E45-SEMANTIC-LEDGER.md',
              'W5-E45-PACKAGE-MANIFEST.txt',
          ]
          missing=[x for x in required if x not in names]
          if missing:
              raise SystemExit(f'missing required E45 files: {missing}')
          py=[n for n in names if n.startswith('verification/') and n.endswith('.py')]
          if len(py)!=64:
              raise SystemExit(f'expected 64 verification scripts, got {len(py)}')
          banned=[n for n in names if ('credential' in n.lower() or 'secret' in n.lower() or 'token' in n.lower() or n.endswith('.sqlite3') or '__pycache__' in n or n.endswith(('.pyc','.nbc','.nbi')))]
          if banned:
              raise SystemExit(f'public-safe package contains banned paths: {banned[:20]}')
          print(len(names),len(py))
          PY
          )
          EOF
          sha="$(sha256sum Navior-stokes-hypothesis-AI-W5-E45.zip | awk '{print $1}')"
          echo "zip_entries=${entries}"
          echo "verification_python_scripts=${verifiers}"
          echo "inner_zip_sha256=${sha}"
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "verifiers=${verifiers}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "source_head=${source_head}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Navior-stokes-hypothesis-AI-W5-E45
          path: Navior-stokes-hypothesis-AI-W5-E45.zip
          retention-days: 90
          if-no-files-found: error
      - name: Commit successful package provenance
        env:
          SOURCE_HEAD: ${{ steps.package.outputs.source_head }}
          ENTRIES: ${{ steps.package.outputs.entries }}
          VERIFIERS: ${{ steps.package.outputs.verifiers }}
          ZIP_SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > verification/W5_E45_package_result.txt <<EOF
          W5_E45_PACKAGE=PASS
          source_head=${SOURCE_HEAD}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          verified_theorem_checker_head=9e7cdc361030dc686be2575f31c02d72a128aa0d
          verified_full_suite_run=32093839544
          r45_specific_run=32093191615
          zip_entries=${ENTRIES}
          verification_python_scripts=${VERIFIERS}
          inner_zip_sha256=${ZIP_SHA}
          scope=PUBLIC_SAFE_VERIFIED_PARTIALS_NOT_GLOBAL_REGULARITY
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/W5_E45_package_result.txt
          git commit -m 'Record W5 E45 package provenance'
          git push origin HEAD:main
