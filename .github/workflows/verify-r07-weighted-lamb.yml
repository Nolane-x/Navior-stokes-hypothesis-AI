name: Verify R07 weighted Lamb theorem

on:
  push:
    paths:
      - 'research/R07_sharp_weighted_Lamb_dissipation.md'
      - 'verification/check_R07_weighted_Lamb.py'
      - '.github/workflows/verify-r07-weighted-lamb.yml'
  pull_request:
    paths:
      - 'research/R07_sharp_weighted_Lamb_dissipation.md'
      - 'verification/check_R07_weighted_Lamb.py'
      - '.github/workflows/verify-r07-weighted-lamb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5'
      - name: Verify R07 structural algebra
        run: python verification/check_R07_weighted_Lamb.py
