name: Package W5 E46 public-safe source

on:
  push:
    paths:
      - '.github/workflows/package-w5-e46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and audit public-safe E46 archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          cat > W5-E46-PACKAGE-MANIFEST.txt <<EOF
          checkpoint=W5-E46
          source_head=${source_head}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          verified_theorem_checker_head=961be1b878eacd69b81e72f495ea29c21dbc9fc7
          verified_full_suite_run=32094820170
          r46_specific_run=32094667211
          external_bridge=Albritton-Barker_arXiv_1811.00507v2_Theorems_1.1_1.2_scope_pinned
          runtime=Nolane World 0.6.0 / W5
          status=NONCONVERGED_PARTIALS_ONLY
          scope=PUBLIC_SAFE_VERIFIED_PARTIALS_NOT_GLOBAL_REGULARITY
          EOF
          zip -qr Navior-stokes-hypothesis-AI-W5-E46.zip \
            README.md docs research corrections discarded experiments verification checkpoints sources .github/workflows W5-E46-PACKAGE-MANIFEST.txt \
            -x '*.sqlite3' '*credentials*' '*credential*' '*secret*' '*token*' '*trust*.json' '*/__pycache__/*' '*.pyc' '*.nbc' '*.nbi'
          test -s Navior-stokes-hypothesis-AI-W5-E46.zip
          unzip -t Navior-stokes-hypothesis-AI-W5-E46.zip >/dev/null
          read entries verifiers <<EOF
          $(python - <<'PY'
          import zipfile
          p='Navior-stokes-hypothesis-AI-W5-E46.zip'
          with zipfile.ZipFile(p) as z: names=z.namelist()
          required=[
            'research/R46_spatially_local_work_scale_and_singularity_ancient_bridge.md',
            'sources/R46_albritton_barker_interior_singularity_ancient_bridge.md',
            'discarded/RD024_ancient_amplitude_scale_not_aligned_with_productive_work_scale.md',
            'verification/check_R46_local_weighted_work_scale.py',
            'verification/fresh_verify_e46_local_work_grid.py',
            'verification/check_RD024_amplitude_productive_scale_misalignment.py',
            'verification/R46_gate_result.txt',
            'verification/W5_E46_full_suite_result.txt',
            'verification/W5_E46_world_gate_result.json',
            'checkpoints/W5-E46-SEMANTIC-LEDGER.md',
            'W5-E46-PACKAGE-MANIFEST.txt',
          ]
          missing=[x for x in required if x not in names]
          if missing: raise SystemExit(f'missing E46 files: {missing}')
          py=[n for n in names if n.startswith('verification/') and n.endswith('.py')]
          if len(py)!=67: raise SystemExit(f'expected 67 verification scripts, got {len(py)}')
          banned=[n for n in names if ('credential' in n.lower() or 'secret' in n.lower() or 'token' in n.lower() or n.endswith('.sqlite3') or '__pycache__' in n or n.endswith(('.pyc','.nbc','.nbi')))]
          if banned: raise SystemExit(f'banned public-safe paths: {banned[:20]}')
          print(len(names),len(py))
          PY
          )
          EOF
          sha="$(sha256sum Navior-stokes-hypothesis-AI-W5-E46.zip | awk '{print $1}')"
          echo "zip_entries=${entries}"
          echo "verification_python_scripts=${verifiers}"
          echo "inner_zip_sha256=${sha}"
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "verifiers=${verifiers}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "source_head=${source_head}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Navior-stokes-hypothesis-AI-W5-E46
          path: Navior-stokes-hypothesis-AI-W5-E46.zip
          retention-days: 90
          if-no-files-found: error
      - name: Commit successful package provenance
        env:
          SOURCE_HEAD: ${{ steps.package.outputs.source_head }}
          ENTRIES: ${{ steps.package.outputs.entries }}
          VERIFIERS: ${{ steps.package.outputs.verifiers }}
          ZIP_SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > verification/W5_E46_package_result.txt <<EOF
          W5_E46_PACKAGE=PASS
          source_head=${SOURCE_HEAD}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          verified_theorem_checker_head=961be1b878eacd69b81e72f495ea29c21dbc9fc7
          verified_full_suite_run=32094820170
          r46_specific_run=32094667211
          zip_entries=${ENTRIES}
          verification_python_scripts=${VERIFIERS}
          inner_zip_sha256=${ZIP_SHA}
          scope=PUBLIC_SAFE_VERIFIED_PARTIALS_NOT_GLOBAL_REGULARITY
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/W5_E46_package_result.txt
          git commit -m 'Record W5 E46 package provenance'
          git push origin HEAD:main
