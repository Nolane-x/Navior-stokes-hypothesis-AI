# Final E44 aggregate includes RD022 peak-center route guard.
name: Verify W5 E44 all Python certificates

on:
  push:
    paths:
      - '.github/workflows/verify-w5-e44-all-python.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-python-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --upgrade numpy numba sympy
      - name: Run every Python certificate in verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(verification/*.py)
          echo "verification_scripts=${#files[@]}"
          count=0
          for f in "${files[@]}"; do
            find experiments verification -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            echo "===== RUN $f ====="
            python "$f"
            count=$((count+1))
          done
          echo "PASS verification_scripts=$count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Commit successful E44 gate record
        env:
          VERIFIED_COUNT: ${{ steps.verify.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail
          verified_sha="$(git rev-parse HEAD)"
          cat > verification/W5_E44_full_suite_result.txt <<EOF
          W5_E44_FULL_SUITE=PASS
          verification_scripts=${VERIFIED_COUNT}
          verified_head=${verified_sha}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          python=3.12
          runner=${RUNNER_OS}
          scope=PARTIAL_CERTIFICATES_ONLY_NOT_GLOBAL_REGULARITY
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/W5_E44_full_suite_result.txt
          git commit -m 'Record W5 E44 full-suite verification pass'
          git push origin HEAD:main
