name: Verify R48 productive-scale alignment

on:
  push:
    paths:
      - '.github/workflows/verify-r48-productive-scale-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-r48:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --upgrade numpy
      - name: Run strengthened R48/C004 and RD026 certificates
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          p="$(python verification/check_R48_productive_scale_alignment.py)"
          f="$(python verification/fresh_verify_e48_work_linked_alignment.py)"
          d="$(python verification/check_RD026_productive_scale_time_alignment.py)"
          echo "$p"
          echo "$f"
          echo "$d"
          grep -q 'R48_PRIMARY_PASS checks=1390000' <<<"$p"
          grep -q 'R48_FRESH_PASS checks=130000' <<<"$f"
          grep -q 'RD026_PASS checks=119928' <<<"$d"
          {
            echo "primary=$p"
            echo "fresh=$f"
            echo "rd026=$d"
          } >> "$GITHUB_OUTPUT"
      - name: Commit successful R48 gate record
        env:
          PRIMARY: ${{ steps.verify.outputs.primary }}
          FRESH: ${{ steps.verify.outputs.fresh }}
          RD026: ${{ steps.verify.outputs.rd026 }}
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          cat > verification/R48_gate_result.txt <<EOF
          R48_GATE=PASS
          source_head=${source_head}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          ${PRIMARY}
          ${FRESH}
          ${RD026}
          C004=PRODUCTIVE_SCALE_WEIGHTED_GRADIENT_NONTRIVIALITY
          scope=VERIFIED_PARTIAL_PRODUCTIVE_SCALE_ALIGNMENT_NOT_GLOBAL_REGULARITY
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/R48_gate_result.txt
          git commit -m 'Record strengthened R48 productive-scale alignment pass'
          git push origin HEAD:main
