name: Verify R40 absolute-work evacuation

on:
  push:
    paths:
      - 'research/R40_strong_finite_catalog_absolute_work_evacuation.md'
      - 'verification/check_R40_absolute_work_evacuation.py'
      - 'verification/fresh_verify_e40_R40_absolute_work.py'
      - '.github/workflows/verify-r40-absolute-work-evacuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r40:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        run: python -m pip install --upgrade numpy
      - name: Verify R40 primary
        run: python verification/check_R40_absolute_work_evacuation.py
      - name: Verify R40 fresh context
        run: python verification/fresh_verify_e40_R40_absolute_work.py
