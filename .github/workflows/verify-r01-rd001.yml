name: Verify R01 RD001 exact core

on:
  push:
    paths:
      - 'research/R01_exact_L3_amplitude_direction_identity.md'
      - 'discarded/RD001_no_universal_L3_pressure_absorption.md'
      - 'verification/check_R01_RD001_symbolic.py'
      - '.github/workflows/verify-r01-rd001.yml'
  pull_request:
    paths:
      - 'research/R01_exact_L3_amplitude_direction_identity.md'
      - 'discarded/RD001_no_universal_L3_pressure_absorption.md'
      - 'verification/check_R01_RD001_symbolic.py'
      - '.github/workflows/verify-r01-rd001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify R01/RD001 exact core
        run: python verification/check_R01_RD001_symbolic.py
