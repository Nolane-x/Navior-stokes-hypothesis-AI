name: Verify W5 E23 all Python certificates

on:
  push:
    paths:
      - '.github/workflows/verify-w5-e23-all-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-python-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --upgrade numpy numba sympy
      - name: Run every Python certificate in verification
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(verification/*.py)
          echo "verification_scripts=${#files[@]}"
          count=0
          for f in "${files[@]}"; do
            # Some legacy finite-dimensional challengers dynamically import
            # Numba-jitted experiment modules with cache=True. Their on-disk
            # cache records a dynamic module name and is intentionally removed
            # between independent certificate processes.
            find experiments verification -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            echo "===== RUN $f ====="
            python "$f"
            count=$((count+1))
          done
          echo "PASS verification_scripts=$count"
