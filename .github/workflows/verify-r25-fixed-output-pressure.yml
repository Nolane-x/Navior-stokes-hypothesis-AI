name: Verify R25 fixed output pressure escape

on:
  push:
    paths:
      - 'research/R25_fixed_output_pressure_work_ultraviolet_escape.md'
      - 'verification/check_R25_fixed_output_pressure_escape.py'
      - '.github/workflows/verify-r25-fixed-output-pressure.yml'
  pull_request:
    paths:
      - 'research/R25_fixed_output_pressure_work_ultraviolet_escape.md'
      - 'verification/check_R25_fixed_output_pressure_escape.py'
      - '.github/workflows/verify-r25-fixed-output-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install --upgrade numpy
      - name: Verify R25
        run: python verification/check_R25_fixed_output_pressure_escape.py
